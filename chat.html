<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI相談 | よりそいマネー</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --accent: #38B2AC;
      --accent2: #2C7A7B;
      --bg: #F0FFF4;
      --white: #FFFFFF;
      --text: #2D3748;
      --text-light: #718096;
      --border: #E2E8F0;
    }
    body { font-family:'Hiragino Sans','Yu Gothic',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }

    nav { background:var(--white); border-bottom:1px solid var(--border); padding:0 24px; height:56px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .logo { font-size:18px; font-weight:700; color:var(--text); text-decoration:none; }
    .logo span { color:var(--accent); }
    .nav-badge { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:11px; padding:3px 10px; border-radius:20px; font-weight:600; }

    .layout { display:flex; flex:1; overflow:hidden; max-width:1100px; width:100%; margin:0 auto; padding:16px; gap:16px; }

    .chat-area { flex:1; display:flex; flex-direction:column; background:var(--white); border-radius:16px; border:1px solid var(--border); overflow:hidden; }
    .chat-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
    .ai-avatar { width:40px; height:40px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
    .ai-info h3 { font-size:15px; font-weight:700; }
    .ai-info p { font-size:12px; color:var(--text-light); }
    .online-dot { width:8px; height:8px; background:#48BB78; border-radius:50%; display:inline-block; margin-right:4px; }

    .messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px; }
    .msg { display:flex; gap:10px; max-width:85%; }
    .msg.user { align-self:flex-end; flex-direction:row-reverse; }
    .msg-avatar { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; }
    .msg.ai .msg-avatar { background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .msg.user .msg-avatar { background:#E2E8F0; }
    .msg-body { display:flex; flex-direction:column; gap:4px; }
    .msg.user .msg-body { align-items:flex-end; }
    .bubble { padding:12px 16px; border-radius:16px; font-size:14px; line-height:1.7; }
    .msg.ai .bubble { background:var(--bg); border-radius:4px 16px 16px 16px; }
    .msg.user .bubble { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-radius:16px 4px 16px 16px; }
    .msg-time { font-size:11px; color:#A0AEC0; }

    .typing .bubble { background:var(--bg); padding:14px 18px; }
    .typing-dots { display:flex; gap:4px; align-items:center; }
    .typing-dots span { width:7px; height:7px; background:var(--text-light); border-radius:50%; animation:bounce 1.2s infinite; }
    .typing-dots span:nth-child(2) { animation-delay:0.2s; }
    .typing-dots span:nth-child(3) { animation-delay:0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    .affiliate-card { border:1px solid var(--border); border-radius:12px; padding:14px 16px; background:var(--white); margin-top:8px; text-decoration:none; color:inherit; display:flex; align-items:center; gap:12px; transition:box-shadow 0.2s,border-color 0.2s; position:relative; }
    .affiliate-card:hover { box-shadow:0 4px 16px rgba(56,178,172,0.15); border-color:var(--accent); }
    .affiliate-icon { font-size:28px; flex-shrink:0; }
    .affiliate-info { flex:1; }
    .affiliate-label { font-size:10px; color:var(--text-light); font-weight:600; margin-bottom:2px; }
    .affiliate-name { font-size:13px; font-weight:700; color:var(--text); margin-bottom:2px; }
    .affiliate-desc { font-size:11px; color:var(--text-light); }
    .affiliate-arrow { color:var(--accent); font-size:18px; }
    .pr-badge { position:absolute; top:8px; right:8px; background:#718096; color:#fff; font-size:9px; font-weight:700; padding:2px 6px; border-radius:4px; letter-spacing:0.5px; }

    .line-banner { background:linear-gradient(135deg,#06C755,#00A041); border-radius:12px; padding:14px 16px; margin-top:8px; display:flex; align-items:center; gap:12px; cursor:pointer; text-decoration:none; }
    .line-banner-text h4 { color:#fff; font-size:13px; font-weight:700; margin-bottom:2px; }
    .line-banner-text p { color:rgba(255,255,255,0.85); font-size:11px; }
    .line-icon { font-size:28px; }

    .disclaimer-bubble { background:#FFFBEB; border:1px solid #F6E05E; border-radius:12px; padding:12px 16px; margin-top:8px; font-size:12px; color:#744210; line-height:1.6; }

    .input-area { padding:16px; border-top:1px solid var(--border); display:flex; gap:10px; align-items:flex-end; }
    .input-wrap { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:8px; transition:border-color 0.2s; }
    .input-wrap:focus-within { border-color:var(--accent); }
    textarea { flex:1; background:none; border:none; outline:none; font-family:inherit; font-size:14px; color:var(--text); resize:none; max-height:100px; line-height:1.5; }
    textarea::placeholder { color:#A0AEC0; }
    .send-btn { width:40px; height:40px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:opacity 0.2s; flex-shrink:0; }
    .send-btn:hover { opacity:0.9; }
    .send-btn svg { width:18px; height:18px; fill:#fff; }

    .side-panel { width:280px; display:flex; flex-direction:column; gap:12px; flex-shrink:0; }
    .panel-card { background:var(--white); border:1px solid var(--border); border-radius:16px; padding:20px; }
    .panel-title { font-size:13px; font-weight:700; color:var(--text); margin-bottom:12px; }
    .topic-btn { width:100%; text-align:left; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:13px; color:var(--text); cursor:pointer; margin-bottom:6px; transition:all 0.2s; font-family:inherit; }
    .topic-btn:last-child { margin-bottom:0; }
    .topic-btn:hover { background:#E6FFFA; border-color:var(--accent); color:var(--accent2); }
    .anon-note { font-size:12px; color:var(--text-light); line-height:1.7; }
    .anon-note li { margin-left:16px; margin-bottom:4px; }

    @media (max-width:768px) { .side-panel { display:none; } }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Money<span>Space</span></a>
  <span class="nav-badge">AI相談 無料・匿名</span>
</nav>

<div class="layout">
  <div class="chat-area">
    <div class="chat-header">
      <div class="ai-avatar">🤖</div>
      <div class="ai-info">
        <h3>よりそいマネー AI</h3>
        <p><span class="online-dot"></span>オンライン・24時間対応</p>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="msg ai">
        <div class="msg-avatar">🤖</div>
        <div class="msg-body">
          <div class="bubble">こんにちは。よりそいマネー AIです。<br>誰にも言えないお金の悩みを、匿名で安心してお話しください。<br><br>借金・家族に内緒の出費・老後の不安など、どんなことでも気軽に話しかけてください。</div>
          <div class="msg-time">今</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="userInput" placeholder="悩みを入力してください（匿名・無料）" rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"
          autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      </div>
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-card">
      <div class="panel-title">💬 よくある相談</div>
      <button class="topic-btn" onclick="setTopic('消費者金融から借りていて返済できなくなってきました')">借金・返済できない</button>
      <button class="topic-btn" onclick="setTopic('妻に内緒でカードローンを使っています')">家族に内緒の借金</button>
      <button class="topic-btn" onclick="setTopic('パチンコで作った借金があります')">ギャンブルの借金</button>
      <button class="topic-btn" onclick="setTopic('55歳で貯金がほとんどありません')">老後・貯金の不安</button>
      <button class="topic-btn" onclick="setTopic('投資詐欺にあったかもしれません')">投資詐欺被害</button>
    </div>
    <div class="panel-card">
      <div class="panel-title">🔒 プライバシーについて</div>
      <ul class="anon-note">
        <li>名前・メール不要</li>
        <li>会話履歴は保存しない</li>
        <li>IPアドレスは記録しない</li>
        <li>いつでも会話を終了できる</li>
      </ul>
    </div>
    <div class="panel-card">
      <div class="panel-title">⚠️ ご注意</div>
      <p class="anon-note" style="list-style:none; padding:0;">本サービスは法律・財務アドバイスではありません。具体的な対処は専門家にご相談ください。</p>
    </div>
  </div>
</div>

<script>
  const affiliates = {
    debt: [
      { icon:'⚖️', label:'弁護士紹介（アフィリエイト）', name:'弁護士ドットコム 無料相談', desc:'債務整理・自己破産を専門家に相談', url:'#' },
      { icon:'📋', label:'司法書士紹介（アフィリエイト）', name:'司法書士法人 無料診断', desc:'過払い金・借金減額を無料でチェック', url:'#' },
    ],
    gambling: [
      { icon:'🏥', label:'支援機関紹介', name:'ギャンブル依存症サポート', desc:'依存症専門のカウンセリング機関', url:'#' },
      { icon:'⚖️', label:'弁護士紹介（アフィリエイト）', name:'弁護士ドットコム 無料相談', desc:'ギャンブル借金の債務整理を相談', url:'#' },
    ],
    family: [
      { icon:'⚖️', label:'弁護士紹介（アフィリエイト）', name:'家族問題専門 弁護士相談', desc:'配偶者間の借金トラブルに対応', url:'#' },
      { icon:'💬', label:'FP紹介（アフィリエイト）', name:'FP無料相談（家計改善）', desc:'家計の見直し・借金計画を一緒に', url:'#' },
    ],
    retirement: [
      { icon:'💰', label:'FP紹介（アフィリエイト）', name:'老後資金 FP無料相談', desc:'退職後のお金の不安をプロに相談', url:'#' },
      { icon:'📊', label:'資産運用サービス', name:'ロボアドバイザー 無料診断', desc:'少額から始める老後の資産運用', url:'#' },
    ],
    fraud: [
      { icon:'⚖️', label:'弁護士紹介（アフィリエイト）', name:'投資詐欺専門 弁護士相談', desc:'被害回復・法的手続きを無料相談', url:'#' },
      { icon:'🏛️', label:'公的機関案内', name:'消費者庁 消費者ホットライン', desc:'188番（局番なし）無料相談', url:'#' },
    ],
    savings: [
      { icon:'💬', label:'FP紹介（アフィリエイト）', name:'家計診断 FP無料相談', desc:'貯金ゼロからの立て直しプランを提案', url:'#' },
      { icon:'📱', label:'アプリ紹介', name:'家計管理アプリ マネーフォワード', desc:'支出の見える化で節約スタート', url:'#' },
    ],
  };

  const rules = [
    {
      keywords:['借金','カードローン','消費者金融','自己破産','債務整理','返済','リボ'],
      category:'debt',
      responses:[
        '話してくれてありがとうございます。今、借入の総額はどのくらいになっていますか？一緒に整理していきましょう。',
        '返済が苦しくなってきているんですね。何社から借りていますか？月々の返済額と手取り収入を教えてもらえますか？',
        '借金の悩みは一人で抱え込むほど深刻になりがちです。今の状況を整理するだけでも気持ちが楽になりますよ。',
      ],
      disclaimer: '債務整理・自己破産は法律的な手続きです。最終的な判断は弁護士・司法書士にご相談ください。',
    },
    {
      keywords:['パチンコ','ギャンブル','競馬','FX','仮想通貨','課金','ホスト','推し活'],
      category:'gambling',
      responses:[
        'その悩み、話してくれてよかったです。誰にも言えなかったのではないですか？今、総額でどのくらいになっていますか？',
        '止められないと感じているなら、意志の問題ではなく依存症のサインかもしれません。専門家のサポートを受けると楽になれる方が多いです。',
        'ギャンブルや課金で作った借金は、専門家への相談で解決できるケースがほとんどです。一人で抱え込まないでください。',
      ],
      disclaimer: 'ギャンブル依存症は病気です。専門機関への相談をおすすめします。',
    },
    {
      keywords:['妻','夫','家族','内緒','バレ','隠して','へそくり'],
      category:'family',
      responses:[
        '家族に言えないのは、すごく苦しいですよね。今、その借金（出費）はどのくらいの金額になっていますか？',
        'バレそうで怖い気持ち、よくわかります。まず現状を整理して、どんな選択肢があるか一緒に考えてみましょう。',
        '家族への影響が心配なんですね。早めに対処するほど選択肢が広がります。今の状況を少し教えてもらえますか？',
      ],
      disclaimer: '夫婦間の借金問題は法的な問題になることもあります。必要に応じて専門家にご相談ください。',
    },
    {
      keywords:['老後','退職','年金','貯金','将来','老後資金','55歳','50代','60代'],
      category:'retirement',
      responses:[
        '老後のお金の不安は多くの方が感じています。今の貯蓄額と、あと何年働けそうかを教えてもらえますか？',
        '今から動き始めれば選択肢はあります。今の収支の状況を教えてもらえますか？',
        '退職後の生活費は月いくらくらいを想定していますか？現状を整理するだけで不安がかなり減ることが多いです。',
      ],
      disclaimer: '資産運用・投資には元本割れのリスクがあります。重要な判断はFP・専門家にご相談ください。',
    },
    {
      keywords:['詐欺','騙','投資詐欺','怪しい','返ってこない'],
      category:'fraud',
      responses:[
        'それは本当につらい経験ですね。いつ頃、どんな経緯でその話に関わりましたか？',
        '投資詐欺は警察や弁護士に相談することで被害回復できるケースがあります。まず、どんな投資話だったか教えてもらえますか？',
        '一人で抱え込まないでください。消費者庁の相談窓口や弁護士への相談が有効です。',
      ],
      disclaimer: '詐欺被害は速やかに警察・弁護士にご相談ください。時間が経つほど回収が難しくなります。',
    },
    {
      keywords:['貯金','貯まらない','赤字','生活費','節約','お金がない'],
      category:'savings',
      responses:[
        '毎月赤字になってしまう原因は、収入と支出のどちらにあると思いますか？',
        '貯金ゼロでも、今から整理すれば必ず改善できます。今の月収と主な支出を教えてもらえますか？',
        '家計の見直しは、まず支出の「見える化」から始めるのが一番効果的です。',
      ],
      disclaimer: null,
    },
  ];

  const defaultResponses = [
    'もう少し詳しく教えていただけますか？どんな状況なのか一緒に整理していきましょう。',
    'それは大変でしたね。いつ頃からそのような状況になりましたか？',
    'お金の悩みは一人で抱え込むと苦しくなりがちです。話してくれてありがとうございます。',
    'なるほど。今一番困っていることは何ですか？',
  ];

  let messageCount = 0;
  let shownLine = false;

  function getTime() {
    return new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  }

  function addMessage(role, text, extras = null) {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;

    let extrasHtml = '';
    if (extras) {
      if (extras.disclaimer) {
        extrasHtml += `<div class="disclaimer-bubble">⚠️ ${extras.disclaimer}</div>`;
      }
      if (extras.affiliates) {
        extrasHtml += extras.affiliates.map(a => `
          <a href="${a.url}" class="affiliate-card" target="_blank" rel="noopener">
            <span class="pr-badge">PR</span>
            <div class="affiliate-icon">${a.icon}</div>
            <div class="affiliate-info">
              <div class="affiliate-label">${a.label}</div>
              <div class="affiliate-name">${a.name}</div>
              <div class="affiliate-desc">${a.desc}</div>
            </div>
            <div class="affiliate-arrow">›</div>
          </a>`).join('');
      }
      if (extras.line) {
        extrasHtml += `<div style="margin-top:12px;text-align:center;">
          <a href="https://px.a8.net/svt/ejp?a8mat=4B3G6J+2LH52I+4FR4+BYDTT" rel="nofollow">
            <img border="0" width="468" height="60" alt="" src="https://www28.a8.net/svt/bgt?aid=260501419157&wid=004&eno=01&mid=s00000020704002008000&mc=1" style="max-width:100%;">
          </a>
          <img border="0" width="1" height="1" src="https://www11.a8.net/0.gif?a8mat=4B3G6J+2LH52I+4FR4+BYDTT" alt="">
        </div>`;
      }
    }

    div.innerHTML = `
      <div class="msg-avatar">${role==='ai'?'🤖':'👤'}</div>
      <div class="msg-body">
        <div class="bubble">${text}</div>
        ${extrasHtml}
        <div class="msg-time">${getTime()}</div>
      </div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function showTyping() {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ai typing'; div.id = 'typing';
    div.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-body"><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function removeTyping() { const t=document.getElementById('typing'); if(t)t.remove(); }

  function detectRule(text) {
    for (const rule of rules) {
      if (rule.keywords.some(k => text.includes(k))) return rule;
    }
    return null;
  }

  function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;
    addMessage('user', text);
    input.value = ''; input.style.height = 'auto';
    messageCount++;
    showTyping();

    setTimeout(() => {
      removeTyping();
      const rule = detectRule(text);
      let response, extras = {};

      if (rule) {
        response = rule.responses[Math.floor(Math.random() * rule.responses.length)];
        if (messageCount >= 2) {
          extras.affiliates = affiliates[rule.category] || [];
          if (rule.disclaimer) extras.disclaimer = rule.disclaimer;
        }
      } else {
        response = defaultResponses[Math.min(messageCount-1, defaultResponses.length-1)];
      }

      if (messageCount >= 3 && !shownLine) {
        extras.line = true;
        shownLine = true;
      }

      addMessage('ai', response, Object.keys(extras).length ? extras : null);
    }, 1000 + Math.random() * 800);
  }

  let isComposing = false;
  document.getElementById('userInput').addEventListener('compositionstart', () => isComposing = true);
  document.getElementById('userInput').addEventListener('compositionend', () => isComposing = false);
  function handleKey(e) { if(e.key==='Enter'&&!e.shiftKey&&!isComposing){e.preventDefault();sendMessage();} }
  function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; }
  function setTopic(text) { document.getElementById('userInput').value=text; document.getElementById('userInput').focus(); }
</script>

</body>
</html>
